<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IGCZ converter</title>
<meta name="description" content="IGCZ: a compact, byte-exact encoding of IGC flight logs. Convert IGC to IGCZ and back in your browser.">
<style>
  :root {
    --bg: #fbfaf7;
    --fg: #1d1d1b;
    --muted: #6b6a65;
    --line: #e2e0d8;
    --card: #ffffff;
    --accent: #2f6fdb;
    --accent-soft: #e8f0fd;
    --ok: #1f7a4a;
    --err: #b3261e;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --bar: #8f8d85;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614;
      --fg: #ecebe6;
      --muted: #9c9b95;
      --line: #2e2d29;
      --card: #1e1e1b;
      --accent: #7aa7f5;
      --accent-soft: #1f2a3d;
      --ok: #5cc28c;
      --err: #f08a80;
      --bar: #6f6e67;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 1.1rem; margin: 40px 0 8px; }
  .lead { color: var(--muted); margin: 0 0 28px; font-size: 1.05rem; }
  code { font-family: var(--mono); font-size: 0.9em; }
  a { color: var(--accent); }

  .bench { margin: 0 0 32px; }
  .bench table { width: 100%; border-collapse: collapse; }
  .bench th {
    width: 6.5em; padding: 5px 12px 5px 0;
    text-align: left; font-weight: 500; font-size: 0.95rem; white-space: nowrap;
  }
  .bench td { padding: 5px 0; }
  .bench .track { display: flex; align-items: center; gap: 8px; }
  /* Bars share one linear scale; room is kept on the right for the value label. */
  .bench .bar {
    width: calc((100% - 7.5em) * var(--v) / var(--max));
    min-width: 2px; height: 18px;
    border-radius: 0 4px 4px 0;
    background: var(--bar);
  }
  .bench tr.igcz .bar { background: var(--ok); }
  .bench .value { font-size: 0.9rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bench tr.igcz th, .bench tr.igcz .value { font-weight: 700; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .bench h2 { margin: 0 0 12px; }
  .bench figure { margin: 0 0 24px; }
  .bench h3 { font-size: 1rem; margin: 0 0 2px; }
  .bench figcaption p { margin: 0 0 8px; color: var(--muted); font-size: 0.9rem; }

  #drop {
    display: block;
    border: 2px dashed var(--line);
    border-radius: 12px;
    background: var(--card);
    padding: 36px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  #drop:hover, #drop:focus-within, #drop.over { border-color: var(--accent); background: var(--accent-soft); }
  #drop strong { display: block; font-size: 1.1rem; margin-bottom: 4px; }
  #drop span { color: var(--muted); font-size: 0.95rem; }
  #drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }

  #results { list-style: none; padding: 0; margin: 16px 0 0; }
  #results li {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2px 12px;
    align-items: center;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    margin-top: 8px;
  }
  .name { font-family: var(--mono); font-size: 0.9rem; overflow-wrap: anywhere; }
  .detail { grid-column: 1; color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
  .detail.err { color: var(--err); }
  .detail .ratio { color: var(--ok); font-weight: 600; }
  .dl {
    grid-row: 1 / span 2; grid-column: 2;
    padding: 6px 12px; border-radius: 8px;
    background: var(--accent); color: var(--bg);
    text-decoration: none; font-size: 0.9rem; font-weight: 600; white-space: nowrap;
  }
  .note { color: var(--muted); font-size: 0.9rem; margin-top: 12px; }

  ul.points { padding-left: 1.2em; }
  ul.points li { margin: 4px 0; }
  pre {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; overflow-x: auto; font-size: 0.85rem;
  }
  footer { margin-top: 48px; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <h1>IGCZ</h1>
  <p class="lead">A compact, byte-exact encoding of IGC files. About <span style="color: var(--ok)">20&times; smaller</span> than IGC.</p>

  <section class="bench">
    <h2>Benchmarks</h2>
    <figure>
      <figcaption>
        <h3>Size</h3>
        <p>Total size of a sample of 185k flights :</p>
      </figcaption>
      <table style="--max: 64.51">
        <caption class="visually-hidden">Total size of the Open IGC Database in each format</caption>
        <tr title="64.51 GB">
          <th scope="row">IGC</th>
          <td><div class="track"><div class="bar" style="--v: 64.51"></div><span class="value">64.5 GB</span></div></td>
        </tr>
        <tr title="15.48 GB, 4.2× smaller than IGC">
          <th scope="row">IGC + gzip</th>
          <td><div class="track"><div class="bar" style="--v: 15.48"></div><span class="value">15.5 GB</span></div></td>
        </tr>
        <tr title="7.2 GB, 9× smaller than IGC">
          <th scope="row">IGC + xz</th>
          <td><div class="track"><div class="bar" style="--v: 7.22"></div><span class="value">7.2 GB</span></div></td>
        </tr>
        <tr class="igcz" title="2.76 GB, 23.3× smaller than IGC">
          <th scope="row">IGCZ</th>
          <td><div class="track"><div class="bar" style="--v: 2.76"></div><span class="value">2.76 GB</span></div></td>
        </tr>
      </table>
    </figure>
    <figure>
      <figcaption>
        <h3>Encode speed</h3>
        <p>MB of IGC per second, one thread on an Apple M3 Pro, 300 flights (gzip and xz at their default levels) :</p>
      </figcaption>
      <table style="--max: 100.3">
        <caption class="visually-hidden">Encode speed, MB of IGC per second</caption>
        <tr title="32.4 MB/s">
          <th scope="row">gzip</th>
          <td><div class="track"><div class="bar" style="--v: 32.4"></div><span class="value">32 MB/s</span></div></td>
        </tr>
        <tr title="8.1 MB/s">
          <th scope="row">xz</th>
          <td><div class="track"><div class="bar" style="--v: 8.1"></div><span class="value">8 MB/s</span></div></td>
        </tr>
        <tr class="igcz" title="100.3 MB/s">
          <th scope="row">IGCZ</th>
          <td><div class="track"><div class="bar" style="--v: 100.3"></div><span class="value">100 MB/s</span></div></td>
        </tr>
      </table>
    </figure>
    <figure>
      <figcaption>
        <h3>Decode speed</h3>
        <p>MB of IGC per second, one thread on an Apple M3 Pro, 300 flights (gzip and xz at their default levels) :</p>
      </figcaption>
      <table style="--max: 1323.8">
        <caption class="visually-hidden">Decode speed, MB of IGC per second</caption>
        <tr title="1,323.8 MB/s">
          <th scope="row">gzip</th>
          <td><div class="track"><div class="bar" style="--v: 1323.8"></div><span class="value">1,324 MB/s</span></div></td>
        </tr>
        <tr title="135.2 MB/s">
          <th scope="row">xz</th>
          <td><div class="track"><div class="bar" style="--v: 135.2"></div><span class="value">135 MB/s</span></div></td>
        </tr>
        <tr class="igcz" title="217.4 MB/s">
          <th scope="row">IGCZ</th>
          <td><div class="track"><div class="bar" style="--v: 217.4"></div><span class="value">217 MB/s</span></div></td>
        </tr>
      </table>
    </figure>
  </section>

  <h2>Try it</h2>

  <label id="drop">
    <input id="file" type="file" multiple accept=".igc,.igcz,.gz,.IGC">
    <strong>Drop files here, or click to choose</strong>
    <span><code>.igc</code> becomes <code>.igcz</code>, <code>.igcz</code> becomes <code>.igc</code>. Gzipped <code>.igc.gz</code> works too.</span>
  </label>
  <ul id="results" aria-live="polite"></ul>
  <p class="note">Files never leave your computer: conversion runs in your browser (WebAssembly build of the Zig library).</p>

  <footer><a href="https://github.com/baptistemarchand/igcz">Source on GitHub</a></footer>
</main>

<script type="module">
const wasm = WebAssembly.instantiateStreaming(fetch("igcz.wasm"))
  .then(({ instance }) => instance.exports);

wasm.then((x) => { document.getElementById("version").textContent = "version " + x.version(); });

const MAGIC = [0x49, 0x47, 0x43, 0x5a]; // "IGCZ"
const results = document.getElementById("results");
const drop = document.getElementById("drop");
const input = document.getElementById("file");

function run(x, fn, bytes) {
  const ptr = x.alloc(bytes.length || 1);
  if (!ptr) throw new Error("OutOfMemory");
  new Uint8Array(x.memory.buffer, ptr, bytes.length).set(bytes);
  const ok = x[fn](ptr, bytes.length);
  x.free(ptr, bytes.length || 1);
  // Read after the call: memory may have grown and moved the buffer.
  const out = new Uint8Array(x.memory.buffer, x.resultPtr(), x.resultLen()).slice();
  if (!ok) throw new Error(new TextDecoder().decode(out));
  return out;
}

const messages = {
  NotIgcz: "not an IGCZ file",
  UnsupportedVersion: "IGCZ file from another format version",
  Corrupt: "truncated or damaged IGCZ file",
  MidnightRollover: "clock jumps back past midnight: not supported",
  NumberTooLarge: "a value is too large to encode",
  OutOfMemory: "out of memory",
};

function size(n) {
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  return (n / 1024 / 1024).toFixed(2) + " MB";
}

async function readBytes(file) {
  let bytes = new Uint8Array(await file.arrayBuffer());
  let name = file.name;
  if (bytes[0] === 0x1f && bytes[1] === 0x8b) {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    bytes = new Uint8Array(await new Response(stream).arrayBuffer());
    name = name.replace(/\.gz$/i, "");
  }
  return { bytes, name };
}

async function convert(file) {
  const li = document.createElement("li");
  li.innerHTML = '<span class="name"></span><span class="detail">Converting…</span>';
  li.querySelector(".name").textContent = file.name;
  results.prepend(li);
  const detail = li.querySelector(".detail");
  try {
    const x = await wasm;
    const { bytes, name } = await readBytes(file);
    const isIgcz = MAGIC.every((b, i) => bytes[i] === b);
    // Encoding accepts any text, so a broken .igcz would otherwise be wrapped again.
    if (!isIgcz && /\.igcz$/i.test(name)) throw new Error("NotIgcz");
    const out = run(x, isIgcz ? "decode" : "encode", bytes);
    const base = name.replace(/\.(igcz|igc)$/i, "");
    const outName = base + (isIgcz ? ".igc" : ".igcz");
    const big = isIgcz ? out.length : bytes.length;
    const small = isIgcz ? bytes.length : out.length;
    const ratio = small ? (big / small).toFixed(1) + "×" : "";
    detail.innerHTML = `${size(bytes.length)} → ${size(out.length)} <span class="ratio"></span>`;
    detail.querySelector(".ratio").textContent = ratio;
    const a = document.createElement("a");
    a.className = "dl";
    a.href = URL.createObjectURL(new Blob([out], { type: "application/octet-stream" }));
    a.download = outName;
    a.textContent = "Download " + (isIgcz ? ".igc" : ".igcz");
    li.querySelector(".name").textContent = outName;
    li.append(a);
  } catch (e) {
    detail.classList.add("err");
    detail.textContent = messages[e.message] || e.message;
  }
}

function handle(files) {
  for (const f of files) convert(f);
}

input.addEventListener("change", () => { handle(input.files); input.value = ""; });
for (const type of ["dragenter", "dragover"]) {
  drop.addEventListener(type, (e) => { e.preventDefault(); drop.classList.add("over"); });
}
for (const type of ["dragleave", "drop"]) {
  drop.addEventListener(type, () => drop.classList.remove("over"));
}
drop.addEventListener("drop", (e) => { e.preventDefault(); handle(e.dataTransfer.files); });
</script>
</body>
</html>
